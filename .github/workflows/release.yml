name: Constructor HUB Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Coding standards
        run: composer run-script lint

      - name: Static analysis
        run: php -d memory_limit=-1 vendor/bin/phpstan analyse --no-progress

      - name: Unit tests
        run: composer run-script test

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' -print0)

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - php
      - javascript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and plugin version
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION=$(grep -m1 '^ \* Version:' tibox-ai-frontend.php | sed 's/^ \* Version: *//')
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "Plugin version ($PLUGIN_VERSION) does not match tag ($TAG_VERSION)." >&2
            exit 1
          fi

          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"

      - name: Build installable package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="dist/tibox-ai-frontend"
          PACKAGE="dist/constructor-hub-tibox-${PLUGIN_VERSION}.zip"

          mkdir -p "$PACKAGE_DIR"
          rsync -a --exclude-from=.distignore ./ "$PACKAGE_DIR/"

          cd dist
          zip -qr "constructor-hub-tibox-${PLUGIN_VERSION}.zip" tibox-ai-frontend
          sha256sum "constructor-hub-tibox-${PLUGIN_VERSION}.zip" > "constructor-hub-tibox-${PLUGIN_VERSION}.zip.sha256"

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "CHECKSUM=${PACKAGE}.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub release and upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PRERELEASE=""
          if [[ "$PLUGIN_VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE" \
            "$CHECKSUM" \
            --verify-tag \
            --generate-notes \
            --title "Constructor HUB Tibox ${PLUGIN_VERSION}" \
            $PRERELEASE
