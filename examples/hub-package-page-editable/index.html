<section class="hub-editable-hero">
  <div class="hub-editable-hero__copy">
    <span class="hub-editable-hero__eyebrow">{{CONTENT.hero.eyebrow}}</span>
    <h1>{{CONTENT.hero.title}}</h1>
    <p>{{CONTENT.hero.description}}</p>
    <a class="hub-editable-hero__cta" href="{{CONTENT.hero.cta_url}}">
      {{CONTENT.hero.cta_label}}
    </a>
  </div>

  <figure class="hub-editable-hero__media">
    <img src="{{CONTENT.hero.image.url}}" alt="{{CONTENT.hero.image.alt}}">
  </figure>
</section>
